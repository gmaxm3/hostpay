apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-argocd-ui-from-trusted-ip
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  policyTypes:
    - Ingress
  ingress:
    # 1. Разрешаем доступ из доверенных IP/подсетей к UI
    - from:
        - ipBlock:
            cidr: 192.168.0.0/24      # Замените на ваш IP или подсеть (например, 192.168.0.50/32)
            # except:
            #   - 192.168.0.100/32    # Можно исключить конкретные IP внутри сети
      ports:
        - protocol: TCP
          port: 8080                  # Внутренний порт контейнера argocd-server

    # 2. Разрешаем внутренний трафик кластера (между компонентами ArgoCD)
    - from:
        - podSelector: {}
#применить
#kubectl --kubeconfig ~/.kube/hostpay-management apply -f argocd/argocd-netpol.yaml
