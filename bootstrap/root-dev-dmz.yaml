apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-dev-dmz
  namespace: argocd
  labels:
    env: dev
    zone: dmz
    app-type: root
spec:
  project: default
  source:
    repoURL: 'git@bitbucket.org:your-org/hostpay-gitops.git'
    targetRevision: HEAD
    path: infrastructure/traefik/overlays/dev-dmz
  destination:

    name: dev-dmz
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true